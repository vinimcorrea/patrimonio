<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Patrimônio">
<title>Patrimônio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#0b0d12;--card:#141821;--card2:#1b2030;--line:#252b3b;--tx:#e8ebf2;--mut:#8a93a8;--acc:#7c9cff;--up:#2fd08a;--dn:#ff6b6b;--warn:#ffb547;--r:16px;
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;transition:background-color .15s,color .15s,opacity .15s,border-color .15s}
button:active{opacity:.65}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:10px}
.i{width:18px;height:18px;flex:none}
.flex{display:flex!important;align-items:center;gap:6px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#f7931a22;color:#ffb35c;text-transform:capitalize}
.plan{border:1px solid #f7931a40;background:linear-gradient(160deg,#1d1a17,var(--card) 55%)}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)} .up{color:var(--up)} .dn{color:var(--dn)} .warn{color:var(--warn)}
.small{font-size:12.5px}
/* lock */
#lock{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px;text-align:center}
#lock img{width:84px;height:84px;border-radius:22px;box-shadow:0 6px 18px #0008}
#lock h1{margin:0;font-size:24px}
#lock form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
input[type=password]{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:17px}
input[type=password]:focus{outline:2px solid var(--acc);border-color:transparent}
.btn{padding:14px;border-radius:12px;background:var(--acc);color:#0b0d12;font-weight:600;font-size:16px}
.btn[disabled]{opacity:.6}
label.chk{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mut);font-size:14px}
#lock .err{color:var(--dn);min-height:20px;font-size:14px}
/* shell */
#app{display:none;padding:calc(var(--safe-t) + 8px) 16px calc(84px + var(--safe-b));max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:6px 0 10px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent)}
header h2{margin:0;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--card);border-radius:10px;padding:3px;gap:2px}
.seg button{min-height:36px;min-width:40px;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--tx);font-weight:600}
.ico{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--card)}
.ico svg{width:18px;height:18px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card h3{margin:0 0 12px;font-size:14px;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero .big{font-size:36px;font-weight:700;letter-spacing:-.5px;margin:2px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:3px 8px;border-radius:999px;background:var(--card2)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--card2);margin:14px 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv{background:var(--card2);border-radius:12px;padding:10px 12px}
.kv b{display:block;font-size:17px;margin-top:2px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .l{flex:1;min-width:0}
.row .l div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row .r{text-align:right}
.tok{width:32px;height:32px;border-radius:50%;background:var(--card2);flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;overflow:hidden}
.tok img{width:100%;height:100%}
.badge{font-size:11px;padding:2px 6px;border-radius:6px;background:var(--card2);color:var(--mut);margin-left:6px;font-weight:500}
.chart{width:100%;height:190px;display:block;touch-action:pan-y}
.chart-tip{font-size:13px;min-height:18px}
.empty{color:var(--mut);text-align:center;padding:18px 8px;font-size:14px}
.note{font-size:12.5px;color:var(--mut);margin-top:10px}
.alert{border:1px solid #ffb54755;background:#ffb5470f}
.alert.bad{border-color:#ff6b6b66;background:#ff6b6b12}
/* gauge */
.gauge{display:flex;align-items:center;gap:16px}
.gauge svg{width:132px;flex:none}
.ltv{height:8px;border-radius:5px;background:var(--card2);position:relative;margin:8px 0 4px}
.ltv i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.ltv u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tx);opacity:.7}
/* strategy */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ring{background:var(--card2);border-radius:14px;padding:10px 4px;text-align:center;border:2px solid transparent;min-height:44px}
.ring.on{border-color:var(--acc)}
.ring svg{width:64px;height:64px}
.ring div{font-size:12.5px;text-transform:capitalize;margin-top:4px}
.alloc{display:grid;grid-template-columns:70px 1fr 74px;gap:8px;align-items:center;font-size:13px;margin:8px 0}
.track{position:relative;height:10px;background:var(--card2);border-radius:6px}
.track i{position:absolute;inset:0 auto 0 0;border-radius:6px;opacity:.9}
.track u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff}
ul.checks{list-style:none;margin:0;padding:0}
.field{width:100%;margin-top:6px;min-height:44px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:17px;font-weight:700}
input[type=range]{width:100%;height:44px;margin-top:2px;accent-color:var(--acc)}
.kv .small{display:block}
.split{height:12px;border-radius:6px;background:#3b82f6;margin:12px 0;overflow:hidden}.split i{display:block;height:100%;background:#f7931a}
ul.checks li{padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
ul.checks li>.i{margin-top:2px}
ul.checks li:first-child{border-top:0}
/* home teaser */
.teaser{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line)}
.teaser .l{flex:1;display:flex;flex-direction:column;gap:3px}
.teaser b{font-size:17px}
.teaser .i{width:20px;height:20px}
@media (hover:hover){.teaser:hover{border-color:#f7931a66}}
/* boot + toast */
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:30}
#boot img{width:72px;height:72px;border-radius:20px;animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.45;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
#toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:20;
  background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px #0009;transition:opacity .2s ease-out,transform .2s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:#ff6b6b66}
button[disabled]{cursor:default}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;padding:8px 8px calc(8px + var(--safe-b));background:#0b0d12ee;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mut);padding:4px 10px;min-width:64px;min-height:48px;border-radius:12px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc)}
.view{display:none}.view.on{display:block;animation:f .18s ease}
@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.hide .num.v{filter:blur(8px)}
.spin{animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:700px){nav{left:50%;right:auto;bottom:16px;transform:translateX(-50%);width:min(520px,calc(100% - 32px));padding:6px;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px #0008}
  #app{padding-bottom:110px}#toast{bottom:100px}.hero .big{font-size:42px}.chart{height:240px}}
</style>
</head>
<body>
<div id="boot" aria-label="Carregando"><img src="icons/icon-192.png" alt=""></div>
<section id="lock">
  <img src="icons/icon-192.png" alt="">
  <h1>Patrimônio</h1>
  <p class="mut" style="margin:0">Cripto + Trade Republic. Os dados são criptografados; digite a senha para abrir.</p>
  <form id="lockform" autocomplete="on">
    <input type="text" name="username" value="patrimonio" autocomplete="username" hidden>
    <input id="pw" type="password" placeholder="Senha" autocomplete="current-password" required>
    <label class="chk"><input id="remember" type="checkbox" checked> Lembrar neste aparelho</label>
    <button class="btn" id="unlock">Abrir</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</section>

<div id="app">
  <header>
    <h2 id="title">Visão geral</h2>
    <div class="seg" id="cur"><button data-c="EUR">€</button><button data-c="USD">US$</button><button data-c="BRL">R$</button></div>
    <button class="ico" id="eye" aria-label="Ocultar valores"></button>
    <button class="ico" id="refresh" aria-label="Atualizar"></button>
  </header>
  <main>
    <section class="view" id="v-home"></section>
    <section class="view" id="v-crypto"></section>
    <section class="view" id="v-tr"></section>
    <section class="view" id="v-strategy"></section>
  </main>
  <nav id="nav">
    <button data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg>Geral</button>
    <button data-v="crypto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 8h4.5a2 2 0 010 4H9h5a2 2 0 010 4H9zM10 6v2M10 16v2M13 6v2M13 16v2"/></svg>Cripto</button>
    <button data-v="tr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Trade Rep.</button>
    <button data-v="strategy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Estratégia</button>
  </nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
